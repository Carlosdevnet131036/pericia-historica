name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Menor privilégio: o pipeline só lê o código, nunca escreve no repositório.
permissions:
  contents: read

# Um push novo na mesma branch cancela a execução antiga, que ficou obsoleta.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Typecheck, testes e build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22 é a versão de referência do projeto (.nvmrc); 24 é a do seu PC.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # npm ci instala exatamente o package-lock.json e falha se ele estiver
      # fora de sincronia com o package.json. npm install poderia alterá-lo.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npx vite build

      - name: Guardar o build
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Preparar o site para o GitHub Pages
        if: matrix.node == 22 && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  publicar:
    name: Publicar no GitHub Pages
    # Só publica a main, e só depois que testes, build, auditoria e testes de navegador passaram.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verificar, auditoria, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Permissões de escrita só neste job, não no pipeline inteiro.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  auditoria:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Falha só para severidade alta ou crítica; as moderadas aparecem no log.
      - run: npm audit --audit-level=high

  e2e:
    name: Testes de navegador (Playwright)
    # Só os fluxos de ponta a ponta: typecheck, testes unitários e build já
    # rodam no job "verificar" e não são repetidos aqui.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # O Chromium da versão fixada do @playwright/test e as bibliotecas de
      # sistema que ele exige no Ubuntu do runner.
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      # O próprio Playwright sobe o servidor Vite (playwright.config.ts).
      - name: Testes de navegador
        run: npm run e2e

      - name: Guardar relatório e rastros (só em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
