name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Menor privilégio: o pipeline só lê o código, nunca escreve no repositório.
permissions:
  contents: read

# Um push novo na mesma branch cancela a execução antiga, que ficou obsoleta.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Typecheck, testes e build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22 é a versão de referência do projeto (.nvmrc); 24 é a do seu PC.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # npm ci instala exatamente o package-lock.json e falha se ele estiver
      # fora de sincronia com o package.json. npm install poderia alterá-lo.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npx vite build

      - name: Guardar o build
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  auditoria:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Falha só para severidade alta ou crítica; as moderadas aparecem no log.
      - run: npm audit --audit-level=high
